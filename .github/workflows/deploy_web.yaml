name: Automated Flutter Web Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # للسماح بالتشغيل اليدوي من المتصفح عند الحاجة

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # تفعيل الكاش لتقليل زمن البناء لـ 40 ثانية فقط

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🚀 Build Wasm Web App
        # بناء التطبيق بمحرك WebAssembly عالي الأداء مع ضبط مسار الاستضافة الفرعي
        run: flutter build web --wasm --release --base-href "/${{ github.event.repository.name }}/"

      - name: 🌐 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true # لإنشاء فرع gh-pages نظيف بدون تاريخ كوميتس ثقيل