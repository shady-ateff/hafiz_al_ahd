name: hafiz_al_ahd
description: "Islamic Prayer App."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.2.2+7

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  bloc: ^9.1.3
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  wakelock_plus: ^1.4.0
  google_fonts: any
  hijri: ^3.0.0
  dartz: ^0.10.1
  adhan: ^2.0.0+1
  alarm: ^5.3.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  shared_preferences: ^2.5.4
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  launch_at_startup: ^0.5.1 # عشان التطبيق يفتح مع الويندوز
  package_info_plus: ^9.0.0 # عشان نجيب اسم التطبيق ونسجله في الويندوز
  window_manager: ^0.4.3 # عشان نتحكم في مقاس الشاشة ونخفيها
  tray_manager: ^0.2.2 # عشان نحط الأيقونة جنب الساعة تحت
  country_state_city_picker: ^1.2.8
  permission_handler: ^12.0.1
  auto_start_flutter: ^1.0.0
  google_nav_bar: ^5.0.7
  flutter_qiblah: ^3.2.0
  lottie: ^2.2.0
  flutter_svg: ^2.2.4
  slider_button: ^3.0.0
  get_it: ^9.2.1
  flutter_timezone: ^5.0.2
  home_widget: ^0.9.0
  android_alarm_manager_plus: ^5.0.0
  audioplayers: ^6.6.0
  device_info_plus: ^12.4.0
  android_intent_plus: ^6.0.0
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.6
  change_app_package_name: ^1.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/
    - assets/sounds/
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: Thuluth
      fonts:
        - asset: assets/fonts/thuluth.ttf
    - family: Kufi
      fonts:
        - asset: assets/fonts/kufi.ttf
    - family: Thuluth Pro
      fonts:
        - asset: assets/fonts/thuluth-2.ttf

  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#121212"
    theme_color: "#121212"
  windows:
    generate: true
    image_path: "assets/images/app_icon_transparent.png"
    icon_size: 48
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#121212" # لون الخلفية السوداء بتاعك
  image: "assets/images/app_icon_transparent.png" # اللوجو (يفضل هنا النسخة اللي بخلفية شفافة)
  android: true
  ios: true
  android_12:
    image: "assets/images/app_icon_transparent_padding.png"
    icon_background_color: "#121212"
